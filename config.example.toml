# Configuração do Clipador de lives.
# Copie este arquivo para config.toml e ajuste os valores.
# O config.toml fica fora do git, porque é específico do seu PC.
#
# Qualquer valor também pode vir de uma variável de ambiente com o prefixo CLIPADOR_
# (ex.: CLIPADOR_NIVEL_LOG=DEBUG), que tem prioridade sobre este arquivo.
# Chaves e tokens NÃO ficam aqui: o login do YouTube fica em pasta_segredos e as chaves do
# TikTok no .env, que só as integrações leem (veja o .env.example).

# Pasta onde o OBS salva as gravações. O ideal é uma pasta só para elas: o serviço coloca
# na fila os vídeos que encontrar aqui.
pasta_gravacoes = "C:/Users/SEU_USUARIO/Videos"

# Minutos sem o arquivo da gravação mudar para considerar que a live terminou.
# Atenção: se você usa o "Pausar gravação" do OBS por mais tempo que isso (num intervalo,
# por exemplo), aumente este valor; senão a live entra na fila pela metade.
minutos_gravacao_parada = 2

# Só processar vídeos com o nome no padrão do OBS (data e hora, ex.: "2026-10-14 20-00-00.mkv").
# Protege contra processar outros vídeos da pasta. Mude para false se você renomeia as lives.
so_nomes_do_obs = true

# Gravações que começaram antes desta data não entram na fila (sem aspas: é uma data do
# TOML). Útil para lives antigas, gravadas antes de o OBS separar as 4 faixas.
# ignorar_gravacoes_antes_de = 2026-10-20

# Pasta onde o app guarda banco, logs e clipes. Um caminho relativo, como este, é
# contado a partir da pasta deste arquivo.
pasta_dados = "dados"

# Quantos momentos a revisão mostra por dia, os de maior nota (de 1 a 100). Os outros
# ficam no "ver mais".
limite_diario = 15

# Quanto detalhe vai para o log: DEBUG, INFO, WARNING ou ERROR.
nivel_log = "INFO"

# Pasta das cópias diárias do banco (o app guarda as 14 mais recentes).
# Se ficar comentada, usa <pasta_dados>/backups. O ideal é outro disco ou uma pasta
# sincronizada com o Google Drive, para o backup sobreviver se este disco falhar.
# pasta_backups = "D:/Backups/Clipador"

# Pasta (fora do git) com o client_secret.json do Google Cloud e o seu login no YouTube
# (etapa 15). Só o pacote das integrações lê o que tem dentro.
pasta_segredos = "segredos"

# Em qual faixa de áudio do OBS está cada fonte, contando a partir de 1 como no OBS
# (Configurações > Saída > Gravação > Faixas de áudio). A faixa 1 é a mistura completa
# que vai para a Twitch; o app não a usa. Esta seção precisa ficar no fim do arquivo.
[faixas]
voz = 2
jogo = 3
musica = 4

# Transcrição da voz (Whisper). Também precisa ficar depois dos campos soltos do começo.
[transcricao]
# "medium" é o melhor que cabe na GTX 1050 Ti (4 GB). Se faltar memória na placa,
# o app usa o modelo_reserva.
modelo = "medium"
modelo_reserva = "small"
# auto = placa de vídeo se houver; "cpu" força o processador (bem mais lento).
dispositivo = "auto"
# Nomes e gírias que o Whisper deve acertar: campeões que você mais joga, seu nick,
# expressões suas. Só os primeiros ~220 tokens são usados: deixe os mais frequentes.
vocabulario = [
    "League of Legends", "LoL", "gank", "flash", "ult", "barão", "dragão", "arauto",
    "pentakill", "first blood", "jungle", "mid", "top", "bot", "suporte", "farm",
]
# A transcrição é salva a cada bloco: se o PC cair, perde no máximo um bloco.
minutos_por_bloco = 10

# Coletor de eventos do League of Legends (abates, mortes, dragões...). Roda junto com o
# serviço e consulta o jogo a cada 2 s, só no seu PC (https://127.0.0.1:2999). Fora de
# partida, só espera.
[lol]
coletar = true

# Como achar os melhores momentos e dar a nota (0 a 100). Nota = 100 × média ponderada
# dos sinais dos detectores ligados (cada sinal vai de 0 a 1).
# Atenção: os pesos (peso) e a janela (segundos_antes, segundos_depois) abaixo valem até você
# aceitar uma sugestão do aprendizado (etapa 14, "clipador aprender"). Depois, vale a versão
# aceita, e mudar estes números aqui não tem efeito.
[deteccao]
max_momentos_por_live = 30
# Momentos com nota abaixo disto são descartados como ruído (ex.: só a torre de um aliado).
nota_minima = 10
# Janela do clipe: começa este tanto antes do 1º sinal e termina este tanto depois do último,
# com duração entre a mínima e a máxima. O aprendizado (etapa 14) sugere uma janela nova a
# partir dos seus ajustes de corte.
segundos_antes = 10
segundos_depois = 5
# Duração mínima e máxima do clipe, em segundos. Valem também para o ajuste do corte na
# revisão (as alças da linha do tempo não passam destes limites).
duracao_minima_s = 15
duracao_maxima_s = 60
# Sinais a menos disto um do outro viram um momento só.
juntar_ate_s = 8

# Picos de volume da sua voz: o sinal principal (gritos, risadas altas).
[deteccao.volume_voz]
ligado = true
peso = 0.5
# Pico = ficar este tanto acima do seu volume normal (a mediana do último minuto de fala)...
db_acima_do_normal = 10
# ...por pelo menos este tempo.
duracao_minima_s = 1.0

# O que você fala (pela transcrição): expressões e fala acelerada.
[deteccao.fala]
ligado = true
peso = 0.25
expressoes = [
    "meu deus", "não acredito", "caramba", "nossa", "socorro", "que isso", "como assim",
    "eu juro", "pelo amor de deus", "mano do céu", "não não não", "olha isso",
]
# Quantas vezes a sua velocidade normal de fala conta como fala acelerada.
fala_acelerada = 1.6

# Eventos da partida de LoL (pentakill > barão > abate...). Os seus valem mais.
[deteccao.lol]
ligado = true
peso = 0.25

# Como cortar os clipes de cada momento (MP4, H.264 + AAC, em dados/clipes/).
[cortes]
# horizontal (16:9); vertical_a (9:16, a tela inteira no centro e o fundo desfocado);
# vertical_b (9:16, a sua câmera em cima e o centro do jogo embaixo; sem câmera, só o jogo).
formatos = ["horizontal", "vertical_a", "vertical_b"]
# auto = placa de vídeo (NVENC) se funcionar; senão, o processador (libx264), mais lento.
# Com a GTX 1050 Ti no driver 580 e o FFmpeg 9, o NVENC não funciona (ver ADR 0006).
encoder = "auto"
# Volume da voz e do jogo no clipe (a faixa da música nunca entra: direitos autorais).
volume_voz = 1.0
volume_jogo = 0.6
# Volume final, em LUFS: -14 é o padrão de YouTube e TikTok.
lufs = -14
# Queimar a legenda (o que você fala) nos clipes verticais.
legendas = true

# O vertical B (ADR 0008). "clipador calibrar" salva um quadro da sua live com uma grade
# (dados/calibracao.png), para achar onde a câmera fica na cena do OBS.
[cortes.vertical_b]
# A câmera, em pixels da gravação (x, y = o canto de cima à esquerda). Sem esta linha, o
# vertical B sai só com o centro do jogo.
# camera = { x = 1500, y = 760, largura = 400, altura = 300 }
# Centro do recorte do jogo, na largura da tela: 0 = esquerda, 0.5 = meio, 1 = direita.
centro_x = 0.5
# Quanto da altura do clipe a câmera ocupa (de 0.2 a 0.5).
altura_camera = 0.3333

# Títulos e hashtags sugeridos pela IA local (Ollama: winget install Ollama.Ollama e
# depois "ollama pull qwen3:4b"). Sem o Ollama, o app usa a frase mais marcante do momento.
[titulos]
# ollama = IA local; simples = sem IA, só a frase mais marcante da transcrição.
fonte = "ollama"
# qwen3:4b (2,5 GB) cabe na GTX 1050 Ti; se faltar memória, usa o modelo_reserva.
modelo = "qwen3:4b"
modelo_reserva = "qwen3:1.7b"
# Hashtags que entram em todo clipe; o modelo completa até max_hashtags com as do momento.
# O YouTube recomenda de 3 a 5, sempre ligadas ao vídeo (mais de 60, ele ignora todas).
hashtags_fixas = ["#leagueoflegends", "#lolbr"]
max_hashtags = 5
# Onde o Ollama atende (o padrão dele, neste PC). Só mude se o Ollama estiver em outra porta.
# endereco = "http://127.0.0.1:11434"
# Quanto esperar a resposta para um momento (s); passou disso, o resto da live vai com o
# título simples (sem IA).
# tempo_limite_s = 180
# Quantos títulos que você escolheu na revisão entram como exemplo do seu estilo.
exemplos = 10

# Desligar o PC sozinho depois do processamento da noite. Só desliga quando a fila terminou
# (gravação em andamento conta como fila) E teclado e mouse estão parados há minutos_ocioso.
# Antes, mostra uma contagem de 60 s: mexer no mouse cancela (ou digite "shutdown /a").
[desligamento]
desligar_ao_terminar = true
minutos_ocioso = 10
# Em teste, só escreve "desligaria agora" no log. Desligue o modo de teste só depois de
# conferir numa noite inteira que o horário no log está certo.
modo_teste = true
# Se você estava usando o PC quando a fila acabou, o app espera você sair de perto por até
# este tempo; depois desiste até a próxima noite (não desliga de tarde, no seu almoço).
espera_maxima_horas = 4

# Publicação no YouTube (etapa 15). Antes do 1º envio: o passo a passo do Google no README
# e "clipador youtube-entrar". Nada sobe sem a sua aprovação na revisão.
[youtube]
# real = envia ao YouTube; simulado = finge (sem internet nem cota), para testar o fluxo.
modo = "real"
# O vídeo sobe privado e o YouTube o publica sozinho no próximo destes horários (relógio do
# PC) que fique a pelo menos antecedencia_min do envio e a intervalo_minimo_min de outra
# publicação.
horarios = ["12:00", "18:00", "21:00"]
intervalo_minimo_min = 120
antecedencia_min = 60
# Depois de aprovar, o envio espera este tempo: até lá, desfazer (U) cancela sem nada sair.
minutos_para_desfazer = 10
# Avisar os inscritos: muitos Shorts por dia viram notificação demais.
notificar_inscritos_shorts = false
notificar_inscritos_videos = true
# Descrição: {titulo} = o título aprovado, {hashtags} = as aprovadas, {data} = o dia da live.
descricao = "{titulo}\n\n{hashtags}"
# Tags de todo vídeo (as hashtags aprovadas entram também, sem o #).
tags = ["League of Legends", "LoL"]
# 20 = Jogos.
categoria = 20
# Thumbnail do pico nos vídeos horizontais (gasta 50 das 10.000 unidades diárias).
thumbnail = true

# A revisão no navegador ("clipador web"). A API só escuta em 127.0.0.1 (este PC).
[revisao]
porta = 8765
abrir_navegador = true
# Para onde vai cada formato quando você aprova (dá para mudar na hora, clipe a clipe).
# youtube = vídeo normal no horizontal e Shorts no vertical.
destinos_padrao = { horizontal = ["youtube"], vertical_a = ["youtube", "tiktok"], vertical_b = ["youtube", "tiktok"] }
