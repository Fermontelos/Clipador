# Configuração do Clipador de lives.
# Copie este arquivo para config.toml e ajuste os valores.
# O config.toml fica fora do git, porque é específico do seu PC.
#
# Qualquer valor também pode vir de uma variável de ambiente com o prefixo CLIPADOR_
# (ex.: CLIPADOR_NIVEL_LOG=DEBUG), que tem prioridade sobre este arquivo.
# Chaves e tokens (YouTube, TikTok) NÃO ficam aqui: ficam no .env, que só as
# integrações leem (veja o .env.example).

# Pasta onde o OBS salva as gravações. O ideal é uma pasta só para elas: o serviço coloca
# na fila os vídeos que encontrar aqui.
pasta_gravacoes = "C:/Users/SEU_USUARIO/Videos"

# Minutos sem o arquivo da gravação mudar para considerar que a live terminou.
# Atenção: se você usa o "Pausar gravação" do OBS por mais tempo que isso (num intervalo,
# por exemplo), aumente este valor; senão a live entra na fila pela metade.
minutos_gravacao_parada = 2

# Só processar vídeos com o nome no padrão do OBS (data e hora, ex.: "2026-10-14 20-00-00.mkv").
# Protege contra processar outros vídeos da pasta. Mude para false se você renomeia as lives.
so_nomes_do_obs = true

# Gravações que começaram antes desta data não entram na fila (sem aspas: é uma data do
# TOML). Útil para lives antigas, gravadas antes de o OBS separar as 4 faixas.
# ignorar_gravacoes_antes_de = 2026-10-20

# Pasta onde o app guarda banco, logs e clipes. Um caminho relativo, como este, é
# contado a partir da pasta deste arquivo.
pasta_dados = "dados"

# Quantos momentos a revisão mostra por dia (de 1 a 100).
limite_diario = 15

# Quanto detalhe vai para o log: DEBUG, INFO, WARNING ou ERROR.
nivel_log = "INFO"

# Pasta das cópias diárias do banco (o app guarda as 14 mais recentes).
# Se ficar comentada, usa <pasta_dados>/backups. O ideal é outro disco ou uma pasta
# sincronizada com o Google Drive, para o backup sobreviver se este disco falhar.
# pasta_backups = "D:/Backups/Clipador"

# Em qual faixa de áudio do OBS está cada fonte, contando a partir de 1 como no OBS
# (Configurações > Saída > Gravação > Faixas de áudio). A faixa 1 é a mistura completa
# que vai para a Twitch; o app não a usa. Esta seção precisa ficar no fim do arquivo.
[faixas]
voz = 2
jogo = 3
musica = 4

# Transcrição da voz (Whisper). Também precisa ficar depois dos campos soltos do começo.
[transcricao]
# "medium" é o melhor que cabe na GTX 1050 Ti (4 GB). Se faltar memória na placa,
# o app usa o modelo_reserva.
modelo = "medium"
modelo_reserva = "small"
# auto = placa de vídeo se houver; "cpu" força o processador (bem mais lento).
dispositivo = "auto"
# Nomes e gírias que o Whisper deve acertar: campeões que você mais joga, seu nick,
# expressões suas. Só os primeiros ~220 tokens são usados: deixe os mais frequentes.
vocabulario = [
    "League of Legends", "LoL", "gank", "flash", "ult", "barão", "dragão", "arauto",
    "pentakill", "first blood", "jungle", "mid", "top", "bot", "suporte", "farm",
]
# A transcrição é salva a cada bloco: se o PC cair, perde no máximo um bloco.
minutos_por_bloco = 10

# Coletor de eventos do League of Legends (abates, mortes, dragões...). Roda junto com o
# serviço e consulta o jogo a cada 2 s, só no seu PC (https://127.0.0.1:2999). Fora de
# partida, só espera.
[lol]
coletar = true

# Como achar os melhores momentos e dar a nota (0 a 100). Nota = 100 × média ponderada
# dos sinais dos detectores ligados (cada sinal vai de 0 a 1).
[deteccao]
max_momentos_por_live = 30
# Momentos com nota abaixo disto são descartados como ruído (ex.: só a torre de um aliado).
nota_minima = 10
# Janela do clipe: começa este tanto antes do 1º sinal e termina este tanto depois do último,
# com duração entre a mínima e a máxima. A etapa 14 ajusta isso pelos seus ajustes de corte.
segundos_antes = 10
segundos_depois = 5
duracao_minima_s = 15
duracao_maxima_s = 60
# Sinais a menos disto um do outro viram um momento só.
juntar_ate_s = 8

# Picos de volume da sua voz: o sinal principal (gritos, risadas altas).
[deteccao.volume_voz]
ligado = true
peso = 0.5
# Pico = ficar este tanto acima do seu volume normal (a mediana do último minuto de fala)...
db_acima_do_normal = 10
# ...por pelo menos este tempo.
duracao_minima_s = 1.0

# O que você fala (pela transcrição): expressões e fala acelerada.
[deteccao.fala]
ligado = true
peso = 0.25
expressoes = [
    "meu deus", "não acredito", "caramba", "nossa", "socorro", "que isso", "como assim",
    "eu juro", "pelo amor de deus", "mano do céu", "não não não", "olha isso",
]
# Quantas vezes a sua velocidade normal de fala conta como fala acelerada.
fala_acelerada = 1.6

# Eventos da partida de LoL (pentakill > barão > abate...). Os seus valem mais.
[deteccao.lol]
ligado = true
peso = 0.25

# Como cortar os clipes de cada momento (MP4, H.264 + AAC, em dados/clipes/).
[cortes]
# horizontal (16:9) e vertical_a (9:16, com o vídeo no centro e o fundo desfocado).
formatos = ["horizontal", "vertical_a"]
# auto = placa de vídeo (NVENC) se funcionar; senão, o processador (libx264), mais lento.
# Com a GTX 1050 Ti no driver 580 e o FFmpeg 9, o NVENC não funciona (ver ADR 0006).
encoder = "auto"
# Volume da voz e do jogo no clipe (a faixa da música nunca entra: direitos autorais).
volume_voz = 1.0
volume_jogo = 0.6
# Volume final, em LUFS: -14 é o padrão de YouTube e TikTok.
lufs = -14
# Queimar a legenda (o que você fala) nos clipes verticais.
legendas = true
