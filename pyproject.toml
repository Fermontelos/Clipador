# Raiz do projeto: um "workspace" do uv que liga as três partes Python num ambiente só.
# Cada parte tem o próprio pyproject.toml, com as próprias dependências:
#
#   integracoes/  YouTube, TikTok e LoL. Único código que lê as chaves do .env.
#   backend/      pipeline, banco, fila, demo e a linha de comando (usa integracoes).
#   api/          servidor FastAPI da revisão (usa backend; nunca integracoes direto).
#
# O frontend (React) fica fora do workspace: tem o próprio package.json (etapa 13).
# As regras de dependência entre as partes são conferidas em tests/test_arquitetura.py.

[tool.uv.workspace]
members = ["integracoes", "backend", "api"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]
# Bibliotecas da NVIDIA para a transcrição na placa de vídeo (etapa 6): cuBLAS e cuDNN da
# linha CUDA 12, a última que a GTX 1050 Ti (Pascal) suporta. Cerca de 1 GB. O "uv sync"
# instala por padrão (default-groups); a CI pula com --no-group gpu, porque não tem placa.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42,<10",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Onde mora o código do projeto (para o ruff separar os nossos imports dos de fora).
src = ["integracoes/src", "backend/src", "api/src"]

[tool.ruff.lint]
# E/F: erros básicos, I: ordem dos imports, UP: sintaxe moderna,
# B: bugs comuns, SIM: simplificações.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "integracoes/tests", "backend/tests", "api/tests"]
# Cada parte tem a sua pasta tests/; o modo importlib evita conflito entre arquivos de
# teste com o mesmo nome em pastas diferentes.
addopts = "--import-mode=importlib"
markers = [
    "lento: testes demorados (ex.: a demo real de 3 min); o pre-commit pula, a CI roda",
]
# Nenhum teste pode passar de 5 min (os mais lentos, a demo inteira com os cortes, levam
# perto de 1 min com o PC livre). Um teste travado falha sozinho, mostrando onde parou, em
# vez de segurar a CI por horas.
timeout = 300

# Cobertura dos testes (etapa 18): quanto do código os testes executam.
# uv run pytest --cov  (o relatório sai no terminal; --cov-report=html gera htmlcov/)
[tool.coverage.run]
source = ["clipador_integracoes", "clipador", "clipador_api"]
branch = true  # conta também os dois lados de cada "if", não só as linhas
# A cobertura do serviço e da demo inclui processos filhos (FFmpeg): o que conta é o Python.

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',  # o corpo dos Protocol (só a assinatura)
]

# Checagem de tipos: uv run mypy (a CI roda). Confere as anotações do código das três partes
# (os testes ficam de fora: usam objetos falsos de propósito).
[tool.mypy]
python_version = "3.12"
files = ["integracoes/src", "backend/src", "api/src"]
mypy_path = ["integracoes/src", "backend/src", "api/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
# Bibliotecas sem tipos publicados (faster-whisper, soundfile, google-api-python-client...)
ignore_missing_imports = true
# As migrações são geradas pelo Alembic (autogenerate), não escritas à mão.
exclude = ["migracoes/versions/"]
