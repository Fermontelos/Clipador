# Roda antes de cada commit. Para ativar: uv run pre-commit install
#
# Os ganchos são "locais": usam o ruff e o pytest do próprio projeto (versões travadas
# no uv.lock), em vez de baixar outra cópia do ruff só para o pre-commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (formatação)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (tipos)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (testes)
        entry: uv run pytest -q -m "not lento"
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend
        name: frontend (tipos e testes do Vitest)
        entry: bash -c "cd frontend && npm run typecheck && npm test"
        language: system
        files: ^frontend/
        pass_filenames: false
