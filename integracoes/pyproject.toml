[project]
name = "clipador-integracoes"
version = "0.1.0"
description = "Integrações do Clipador com YouTube, TikTok e LoL. Único código que lê as chaves."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitor Fermontelos", email = "126780811+Fermontelos@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Sem dependência do resto do app: as integrações não conhecem banco, fila nem API.
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
