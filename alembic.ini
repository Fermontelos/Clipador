# Configuração do Alembic para uso na linha de comando (desenvolvimento).
# O app em si não usa este arquivo: ele migra o banco sozinho ao abrir.
#
# Criar uma migração nova depois de mudar src/clipador/banco/modelos.py:
#   uv run alembic revision --autogenerate -m "o que mudou"

[alembic]
script_location = src/clipador/banco/migracoes
# Banco usado para comparar com os modelos ao gerar migrações.
sqlalchemy.url = sqlite:///dados/clipador.db
