[project]
name = "clipador"
version = "0.1.0"
description = "Backend do Clipador: pipeline, banco, fila, demo e linha de comando."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitor Fermontelos", email = "126780811+Fermontelos@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "clipador-integracoes",
    "faster-whisper>=1.2.1",
    # Motor do faster-whisper. A linha 4.x usa CUDA 12 (conferido na DLL da 4.8.3: ela
    # pede cublas64_12.dll); o CUDA 13 não roda na GTX 1050 Ti. Um teste confere isso.
    "ctranslate2>=4.8.3,<5",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "soundfile>=0.14.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "watchdog>=6.0.0",
    "ollama>=0.6.3",
    "tzdata>=2026.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
clipador = "clipador.cli:main"

[tool.uv.sources]
clipador-integracoes = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
