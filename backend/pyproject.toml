[project]
name = "clipador"
version = "0.1.0"
description = "Backend do Clipador: pipeline, banco, fila, demo e linha de comando."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitor Fermontelos", email = "126780811+Fermontelos@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "clipador-integracoes",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "soundfile>=0.14.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "watchdog>=6.0.0",
]

[project.scripts]
clipador = "clipador.cli:main"

[tool.uv.sources]
clipador-integracoes = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
