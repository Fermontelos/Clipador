[project]
name = "clipador-api"
version = "0.1.0"
description = "API local (FastAPI) da revisão de clipes do Clipador."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitor Fermontelos", email = "126780811+Fermontelos@users.noreply.github.com" }
]
requires-python = ">=3.12"
# A API usa o backend; nunca as integrações direto (ver tests/test_arquitetura.py).
dependencies = [
    "clipador",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

# "clipador web": a API se cadastra no CLI do backend (que não pode importá-la, ADR 0003).
[project.entry-points."clipador.comandos"]
web = "clipador_api.comando:web"

[tool.uv.sources]
clipador = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
