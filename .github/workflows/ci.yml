# CI: a cada push, confere lint, formatação e testes.
# Roda em Windows porque o app usa funções do Windows (energia, ociosidade, desligamento).
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    # Os testes levam uns 10 min no PC, e a medição da cobertura deixa mais lento. Sem este
    # limite, um travamento segura a máquina por até 6 h (aconteceu: um FFmpeg que não foi
    # encerrado travou a CI por 5 h).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # O setup-uv não publica a etiqueta "v10" flutuante, por isso a versão exata.
      - name: Instalar o uv
        uses: astral-sh/setup-uv@v10.3.0

      # A imagem Windows do GitHub não traz o FFmpeg, mas traz o Chocolatey. "ffmpeg-full"
      # é a mesma build "full" do gyan.dev usada no PC (tem o Opus e o drawtext da demo).
      - name: Instalar o FFmpeg
        run: choco install ffmpeg-full -y --no-progress

      # --all-packages: instala as três partes Python do workspace (integracoes, backend, api).
      # --no-group gpu: as bibliotecas da NVIDIA (~1 GB) não servem para nada aqui, porque a
      # máquina da CI não tem placa de vídeo; os testes usam um Whisper falso.
      - name: Instalar dependências (exatamente as do uv.lock)
        run: uv sync --locked --all-packages --no-group gpu

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      # Confere as anotações de tipo das três partes Python ([tool.mypy] no pyproject.toml).
      - name: Tipos (mypy)
        run: uv run mypy

      - name: Testes (inclusive os lentos), com a cobertura
        run: uv run pytest --cov

      # O roteiro (etapa 18) pede pelo menos 80% nos detectores e no alinhamento do LoL, as
      # partes com testes obrigatórios: abaixo disso, a CI falha.
      - name: Cobertura dos detectores e do alinhamento (mínimo 80%)
        run: >-
          uv run coverage report --fail-under=80
          --include="*/clipador/detectores/*,*/clipador/jogo/alinhamento.py"

  # A interface de revisão (etapa 13): tipos, testes do Vitest e o build. Roda em Linux
  # (mais rápido): não usa nada do Windows.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npx vite build
