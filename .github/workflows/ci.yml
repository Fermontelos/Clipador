# CI: a cada push, confere lint, formatação e testes.
# Roda em Windows porque o app usa funções do Windows (energia, ociosidade, desligamento).
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    # Tudo leva uns 6 min. Sem este limite, um travamento segura a máquina por até 6 h
    # (aconteceu: um FFmpeg que não foi encerrado travou a CI por 5 h).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # O setup-uv não publica a etiqueta "v10" flutuante, por isso a versão exata.
      - name: Instalar o uv
        uses: astral-sh/setup-uv@v10.3.0

      # A imagem Windows do GitHub não traz o FFmpeg, mas traz o Chocolatey. "ffmpeg-full"
      # é a mesma build "full" do gyan.dev usada no PC (tem o Opus e o drawtext da demo).
      - name: Instalar o FFmpeg
        run: choco install ffmpeg-full -y --no-progress

      # --all-packages: instala as três partes Python do workspace (integracoes, backend, api).
      # --no-group gpu: as bibliotecas da NVIDIA (~1 GB) não servem para nada aqui, porque a
      # máquina da CI não tem placa de vídeo; os testes usam um Whisper falso.
      - name: Instalar dependências (exatamente as do uv.lock)
        run: uv sync --locked --all-packages --no-group gpu

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Testes (inclusive os lentos)
        run: uv run pytest
